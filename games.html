<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Library | Crazy Ferret Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: #080a2b url("background.gif") center center / cover fixed no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 20, .55);
      z-index: -1;
    }
    header {
      text-align: center;
      padding: 55px 20px 35px;
    }
    h1 {
      font-size: clamp(2.5rem, 7vw, 4rem);
      margin: 0 0 12px;
      text-shadow: 4px 4px 0 #000, 0 0 15px #4c6cff;
    }
    .library-panel {
      width: min(900px, calc(100% - 32px));
      min-height: 250px;
      margin: 0 auto 60px;
      padding: 35px 24px;
      text-align: center;
      background: rgba(5, 7, 35, .88);
      border: 3px solid #303cff;
      border-radius: 12px;
      box-shadow: 7px 7px 0 rgba(0, 0, 0, .8), 0 0 22px rgba(76, 108, 255, .25);
    }
    .library-panel h2 { margin-top: 0; font-size: 2rem; }
    .library-panel p { font-size: 1.15rem; line-height: 1.6; }
    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 24px;
      background: #303cff;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      border: 3px solid #111;
      border-radius: 8px;
      box-shadow: 4px 4px 0 #000;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .button:hover, .button:focus-visible {
      background: #5260ff;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
      outline: 2px solid white;
      outline-offset: 4px;
    }
    footer { padding: 22px; text-align: center; background: rgba(0, 0, 0, .82); }
  </style>
</head>
<body>
  <header>
    <h1>Game Library</h1>
    <p>Explore games from Crazy Ferret Games.</p>
  </header>
  <main class="library-panel">
    <h2>Games</h2>
    <p>No games have been added yet.</p>
    <a class="button" href="index.html">BACK TO HOME</a>
  </main>
  <footer>© 2026 Crazy Ferret Games</footer>
</body>
</html>
