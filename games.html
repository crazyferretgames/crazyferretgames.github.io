<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Library | Crazy Ferret Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: #080a2b url("background.gif") center center / cover fixed no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 20, .55);
      z-index: -1;
    }
    header {
      text-align: center;
      padding: 55px 20px 35px;
    }
    h1 {
      font-size: clamp(2.5rem, 7vw, 4rem);
      margin: 0 0 12px;
      text-shadow: 4px 4px 0 #000, 0 0 15px #4c6cff;
    }
    .library-panel {
      width: min(900px, calc(100% - 32px));
      min-height: 250px;
      margin: 0 auto 60px;
      padding: 35px 24px;
      text-align: center;
      background: rgba(5, 7, 35, .88);
      border: 3px solid #303cff;
      border-radius: 12px;
      box-shadow: 7px 7px 0 rgba(0, 0, 0, .8), 0 0 22px rgba(76, 108, 255, .25);
    }
    .library-panel h2 { margin-top: 0; font-size: 2rem; }
    .library-panel p { font-size: 1.15rem; line-height: 1.6; }
    .game-card {
      width: 100%;
      max-width: 650px;
      margin: 28px auto 20px;
      padding: 30px;
      text-align: left;
      background: linear-gradient(135deg, rgba(28, 34, 112, .98), rgba(8, 10, 42, .98));
      border: 3px solid #6875ff;
      border-radius: 12px;
      box-shadow: 6px 6px 0 #000, 0 0 24px rgba(76, 108, 255, .35);
    }
    .game-thumbnail-link { display:block; border-radius:8px; overflow:hidden; border:2px solid #6875ff; margin-bottom:22px; }
    .game-thumbnail { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; image-rendering:auto; transition:transform .2s ease, filter .2s ease; }
    .game-thumbnail-link:hover .game-thumbnail, .game-thumbnail-link:focus-visible .game-thumbnail { transform:scale(1.025); filter:brightness(1.12); }
    .game-banner {
      display: flex;
      min-height: 115px;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      padding: 18px;
      border: 2px solid rgba(170, 180, 255, .6);
      border-radius: 8px;
      background: linear-gradient(135deg, #090b30, #2524a0, #090b30);
      color: #fff;
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      font-weight: 900;
      letter-spacing: .04em;
      text-align: center;
      text-shadow: 3px 3px 0 #000, 0 0 12px #6875ff;
    }
    .game-card h3 {
      margin: 0 0 10px;
      font-size: 1.7rem;
      color: #aab4ff;
      text-shadow: 2px 2px 0 #000;
    }
    .game-card p { margin: 0; }
    .status {
      display: inline-block;
      margin-top: 16px;
      padding: 5px 10px;
      border: 1px solid #8b94ff;
      border-radius: 5px;
      color: #d5d9ff;
      font-size: .85rem;
      font-weight: bold;
      letter-spacing: .06em;
    }
    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 24px;
      background: #303cff;
      color: white;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      border: 3px solid #111;
      border-radius: 8px;
      box-shadow: 4px 4px 0 #000;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .button:hover, .button:focus-visible {
      background: #5260ff;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
      outline: 2px solid white;
      outline-offset: 4px;
    }
    footer { padding: 22px; text-align: center; background: rgba(0, 0, 0, .82); }
  </style>
</head>
<body>
  <header>
    <h1>Game Library</h1>
    <p>Explore games from Crazy Ferret Games.</p>
  </header>
  <main class="library-panel">
    <h2>Games</h2>
    <article class="game-card" aria-labelledby="shift-nightmare-title">
      <a class="game-thumbnail-link" href="shift-nightmare.html" aria-label="Play Shift Nightmare">
        <img class="game-thumbnail" src="shift-nightmare-thumbnail.png" alt="Shift Nightmare pixel horror game thumbnail">
      </a>
      <h3 id="shift-nightmare-title">Shift Nightmare</h3>
      <p>A glitchy, eerie pixel horror experience. Click the thumbnail or button to play.</p>
      <span class="status">PLAY IN BROWSER</span><br>
      <a class="button" href="shift-nightmare.html">PLAY SHIFT NIGHTMARE</a>
    </article>
    <a class="button" href="index.html">BACK TO HOME</a>
  </main>
  <footer>© 2026 Crazy Ferret Games</footer>
</body>
</html>
