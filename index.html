<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Ferret Games</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: #080a2b url("background.gif") center center / cover fixed no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 20, 0.38);
      z-index: -1;
    }
    header {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      margin: 0 0 10px;
      text-shadow: 4px 4px 0 #000, 0 0 15px #4c6cff;
    }
    p { font-size: clamp(1.1rem, 3vw, 1.4rem); text-shadow: 3px 3px 0 #000; }
    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 30px;
      background: #303cff;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border: 3px solid #111;
      border-radius: 8px;
      box-shadow: 5px 5px 0 #000;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .button:hover, .button:focus-visible {
      background: #5260ff;
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 #000;
      outline: 2px solid white;
      outline-offset: 4px;
    }
    footer { padding: 25px; text-align: center; background: rgba(0, 0, 0, .8); font-size: .95rem; }
  </style>
</head>
<body>
  <header>
    <h1>Crazy Ferret Games</h1>
    <p>Games made by a crazy ferret.</p>
    <a class="button" href="games.html">VIEW GAMES</a>
  </header>
  <footer>© 2026 Crazy Ferret Games</footer>
</body>
</html>
