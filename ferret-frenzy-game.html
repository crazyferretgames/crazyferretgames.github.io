function upEnemy(e,dt){e.cd-=dt;e.hit-=dt;e.ph+=dt;const dx=P.x-e.x;

 if(b.type=='crow'){const cyc=low?['fly','mega']:ph==1?['fly','gears','bombs','feathers']:ph==2?['land','charge','birds','lasers']:['gears','charge','lasers','birds','feathers','bombs'];
  const dur={fly:1,gears:2.2,bombs:2.2,feathers:1.6,land:.8,charge:1.8,birds:1.1,lasers:2,mega:3.2}[b.mode]||1;
  if(b.mode=='idle'||b.t>dur/sp){b.mode=cyc[b.n++%cyc.length];b.t=0;b.shots=0;b.rt=0;b.fe=0;b.cd=0;if(b.mode=='birds')for(let k=0;k<3;k++)EN.push({t:'hawk',x:b.x+R(-150,150),y:120,w:44,h:44,vx:0,vy:0,hp:1,cd:0,dir:-1,hit:0,ph:R(0,6),st:'patrol',y0:120})}
  const gr=b.mode=='land'||b.mode=='charge';b.y+=((gr?GY-110:240)-b.y)*Math.min(1,dt*5);
  if(b.mode=='charge'){if(b.t>.5){if(!b.cd)b.cd=Math.sign(P.x-b.x)||1;b.x+=b.cd*(ph==3?820:700)*dt;if(b.x<LEN-1100||b.x>LEN-160)b.cd=-b.cd}}else b.x+=(cx+Math.sin(S.t*1.1*sp)*380-b.x)*Math.min(1,dt*3);
  if(b.mode=='gears'&&b.rt<=0){b.rt=.5/sp;const a=Math.atan2(P.y-b.y,P.x-b.x);fire(b.x,b.y,Math.cos(a)*380,Math.sin(a)*380,{fr:false,dmg:1,r:13,c:C.mustard,l:4})}
  if(b.mode=='bombs'&&b.rt<=0){b.rt=.4/sp;fire(b.x+R(-60,60),b.y+70,0,60,{fr:false,dmg:1,r:15,c:'#333',g:800,l:4})}
  if(b.mode=='feathers'&&b.t>.4+b.fe*.6&&b.fe<2){b.fe++;const a=Math.atan2(P.y-b.y,P.x-b.x);for(let k=-2;k<=2;k++)fire(b.x,b.y,Math.cos(a+k*.22)*430,Math.sin(a+k*.22)*430,{fr:false,dmg:1,r:8,c:k==0?C.pink:'#7a5a3a',pink:k==0,l:4})}
  if(b.mode=='lasers'&&b.t>.5&&b.rt<=0){if(b.shots++==0)b.la=Math.atan2(P.y-b.y,P.x-b.x);b.rt=.12;fire(b.x+60,b.y-30,Math.cos(b.la)*760,Math.sin(b.la)*760,{fr:false,dmg:1,r:7,c:C.red,l:3})}
  if(b.mode=='mega'&&b.rt<=0){b.rt=1.05;const gap=Math.floor(R(2,9));for(let k=0;k<13;k++){if(Math.abs(k-gap)<2)continue;fire(S.cam.x+W+20,k*54+30,-310,0,{fr:false,dmg:1,r:20,c:C.mustard,pink:k%5==3,l:8})}}}
 else{const cyc=ph==1?['spiral','ring','rest']:ph==2?['teleport','ring','meteors','spiral']:['spiral2','meteors','teleport','ring','meteors'];
  const dur={spiral:2.6,spiral2:3,ring:1.4,rest:.8,teleport:1.5,meteors:3}[b.mode]||1;
  if(b.mode=='idle'||b.t>dur/sp){b.mode=cyc[b.n++%cyc.length];b.t=0;b.shots=0;b.rt=0;b.tp=0}
  b.y+=(300+Math.sin(S.t*1.7)*30-b.y)*Math.min(1,dt*4);
  if(b.mode=='teleport'){if(b.t<.4)b.alpha=1-b.t/.4*.9;else{if(!b.tp){b.tp=1;b.x=LEN-R(350,950)}b.alpha=Math.min(1,(b.t-.4)*3);if(b.t>.8&&b.shots<1){b.shots=1;const a=Math.atan2(P.y-b.y,P.x-b.x);for(let k=-2;k<=2;k++)fire(b.x,b.y,Math.cos(a+k*.25)*400,Math.sin(a+k*.25)*400,{fr:false,dmg:1,r:11,c:k==0?C.pink:'#fff3a0',pink:k==0,l:4})}}}
  else{b.alpha=1;b.x+=(cx+Math.sin(S.t*.8)*300-b.x)*Math.min(1,dt*2)}
  if((b.mode=='spiral'||b.mode=='spiral2')&&b.rt<=0){b.rt=.11/sp;for(let k=0;k<(b.mode=='spiral2'?2:1);k++){const a=b.t*4+k*3.14,pk=k==0&&Math.floor(b.t*9)%9==0;fire(b.x,b.y,Math.cos(a)*290,Math.sin(a)*290,{fr:false,dmg:1,r:8,c:pk?C.pink:'#fff3a0',pink:pk,l:5})}}
  if(b.mode=='ring'&&b.t>.3+b.shots*.5&&b.shots<2){b.shots++;for(let k=0;k<16;k++){const a=k*.3927+b.shots*.2;fire(b.x,b.y,Math.cos(a)*270,Math.sin(a)*270,{fr:false,dmg:1,r:10,c:k%4==0?C.pink:'#ffd9a0',pink:k%4==0,l:5})}}
  if(b.mode=='meteors'&&b.rt<=0){b.rt=.3/sp;fire(S.cam.x+R(60,W-60),-20,R(-60,60),340,{fr:false,dmg:1,r:18,c:C.orange,pink:Math.random()<.15,l:5})}}
 if(b.alpha>.5&&hit(P,{x:b.x-b.w/2+30,y:b.y-b.h/2+30,w:b.w-60,h:b.h-50}))hurt()}
function drawBoss2(b){g.save();g.translate(b.x,b.y);const f=b.hit>0,d=P.x<b.x?-1:1;if(b.dead)g.rotate(Math.sin(S.t*40)*.05);g.strokeStyle=C.brown;g.lineWidth=6;
 if(b.type=='crow'){g.scale(d,1);const fl=Math.sin(S.t*(b.mode=='land'||b.mode=='charge'?4:9))*28,br=f?'#fff':b.phase==3?'#b97a4a':'#c79a3a';
  g.fillStyle=f?'#fff':'#a97f2e';g.beginPath();g.moveTo(-40,-30);g.bezierCurveTo(-150,-120+fl,-210,-40+fl*1.3,-170,40);g.bezierCurveTo(-120,0,-80,10,-30,20);g.fill();g.stroke();
  g.fillStyle='#6b5a48';g.fillRect(-70,-110,20,40);g.strokeRect(-70,-110,20,40);g.fillRect(-40,-120,20,50);g.strokeRect(-40,-120,20,50);for(let k=0;k<3;k++){const t=(S.t*.7+k/3)%1;g.globalAlpha=1-t;g.fillStyle='#ddd';g.beginPath();g.arc(-60+k*14,-125-t*70,10+t*18,0,6.28);g.fill()}g.globalAlpha=1;
  hose(-20,70,-34,105,-6,10);hose(30,70,44,105,6,10);blob(-40,108,22,8,'#8a6a2a');blob(50,108,22,8,'#8a6a2a');
  g.fillStyle=br;g.beginPath();g.ellipse(0,0,100,86,0,0,6.28);g.fill();g.stroke();
  blob(0,10,42,42,b.phase==3?'#e9c0b0':'#f4efe0');for(let k=0;k<12;k++){const a=k*.5236;g.beginPath();g.moveTo(Math.cos(a)*34,10+Math.sin(a)*34);g.lineTo(Math.cos(a)*40,10+Math.sin(a)*40);g.stroke()}const ha=S.t*(b.phase==3?6:1.2);g.beginPath();g.moveTo(0,10);g.lineTo(Math.cos(ha)*30,10+Math.sin(ha)*30);g.stroke();if(b.phase==3){g.strokeStyle=C.red;g.beginPath();g.moveTo(-30,-20);g.lineTo(0,10);g.lineTo(28,-6);g.stroke();g.strokeStyle=C.brown}
  blob(70,-70,46,40,br);g.fillStyle=C.mustard;g.beginPath();g.moveTo(104,-76);g.lineTo(190,-56);g.lineTo(104,-50);g.closePath();g.fill();g.stroke();eye(66,-82,15,.8,.2);eye(92,-82,13,.8,.2);if(b.mode=='lasers'&&b.t<.5){g.fillStyle='rgba(255,60,40,.7)';g.beginPath();g.arc(98,-82,16+Math.sin(S.t*40)*4,0,6.28);g.fill()}}
 else{g.globalAlpha=b.alpha===undefined?1:b.alpha;blob(0,0,110,110,f?'#fff':'#e8e2c0');[[-40,-30,20],[50,-10,14],[10,50,24],[-50,40,12]].forEach(([x,y,r])=>blob(x,y,r,r,'#cfc79a'));eye(-34,-20,18,.5,.4);eye(34,-20,18,.5,.4);g.strokeStyle=C.brown;g.lineWidth=6;g.beginPath();g.arc(0,30,36,.2,2.9);g.stroke();
  g.fillStyle=C.mustard;g.beginPath();g.moveTo(-70,-90);g.lineTo(-50,-150);g.lineTo(-20,-100);g.lineTo(0,-160);g.lineTo(20,-100);g.lineTo(50,-150);g.lineTo(70,-90);g.closePath();g.fill();g.stroke();
  hose(-100,20,-150,70+Math.sin(S.t*3)*10,-10,10);hose(100,20,150,70-Math.sin(S.t*3)*10,10,10);blob(-152,72,16,16,'#fff');blob(152,72,16,16,'#fff');g.globalAlpha=1}
 g.restore()}
function drawSigns(){for(const sg of SG){g.fillStyle='#a8743a';g.strokeStyle=C.brown;g.lineWidth=4;g.fillRect(sg.x-4,GY-70,8,70);g.strokeRect(sg.x-4,GY-70,8,70);g.fillRect(sg.x-30,GY-110,60,40);g.strokeRect(sg.x-30,GY-110,60,40);txt('?',sg.x,GY-80,30,C.cream)}
 if(!LV[S.lv].boss){const fx=LEN-150;g.fillStyle=C.cream;g.strokeStyle=C.brown;g.lineWidth=4;g.fillRect(fx,GY-180,8,180);g.strokeRect(fx,GY-180,8,180);g.fillStyle=C.red;g.beginPath();g.moveTo(fx+8,GY-180);g.quadraticCurveTo(fx+50,GY-175+Math.sin(S.t*6)*10,fx+90,GY-150);g.quadraticCurveTo(fx+50,GY-135+Math.sin(S.t*6)*10,fx+8,GY-120);g.fill();g.stroke()}}
// ---- Main loop (delta-time)
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);
 g.save();g.clearRect(0,0,W,H);
 if(S.state=='title')title();else if(S.state=='map')drawMap();else if(S.state=='shop')drawShop();
 else{const sx=S.shake>0?R(-S.shake,S.shake):0,sy=S.shake>0?R(-S.shake,S.shake):0;g.translate(sx,sy);if(S.intro>0){g.translate(W/2,H/2);g.scale(1.06,1.06);g.translate(-W/2,-H/2)}drawWorld();g.setTransform(1,0,0,1,0,0);drawHUD();
  if(S.flash>0){g.fillStyle=`rgba(255,250,230,${S.flash*.7})`;g.fillRect(0,0,W,H)}
  if(S.state=='dead'){g.fillStyle='rgba(30,15,5,.8)';g.fillRect(0,0,W,H);txt('GOSH DARN IT!',W/2,200,100,C.red);deadInfo();txt('Click or ENTER to RETRY',W/2,470,34);txt('Q: quit to world map',W/2,520,24)}
  if(S.state=='results')results()}
 if(S.trans>0){g.setTransform(1,0,0,1,0,0);g.fillStyle=C.brown;g.beginPath();g.rect(0,0,W,H);g.arc(W/2,H/2,(1-S.trans)*900,0,6.28,true);g.fill()}
 g.restore();grain();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
